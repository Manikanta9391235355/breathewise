services:
  estateiq-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: estateiq-ai:latest
    container_name: estateiq-ai-app
    ports:
      - "${PORT:-10000}:10000"
    env_file:
      - .env
    environment:
      - PORT=10000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - DATA_DIR=data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
